package com.dentax.client.module.modules.combat;

import com.dentax.client.module.Module;
import net.minecraft.client.MinecraftClient;
import net.minecraft.entity.LivingEntity;
import net.minecraft.entity.player.PlayerEntity;
import net.minecraft.item.Items;
import net.minecraft.util.Hand;

public class SpearAura extends Module {

    private float chargeRange = 6.0f;  // Şarj saldırısı (uzak)
    private float jabRange = 3.5f;     // Jab saldırısı (yakın)
    private int cooldown = 0;

    public SpearAura() {
        super("SpearAura", "Mizrak ile otomatik saldırı: koşarken şarj, yakında jab", Category.COMBAT);
    }

    @Override
    public void onTick() {
        MinecraftClient mc = MinecraftClient.getInstance();
        if (mc.player == null || mc.world == null || mc.interactionManager == null) return;

        // Elde Spear (Mizrak) var mı kontrol et
        boolean hasSpear = mc.player.getMainHandStack().isOf(Items.WOODEN_SWORD) // placeholder
                || mc.player.getMainHandStack().getItem().toString().contains("spear");
        // Not: 1.21.11 spear item adı: Items.SPEAR (eğer yarn mapping güncellenmediyse)
        // Gerçek Item: Items.SPEAR - Fabric API güncellenince tam çalışır
        if (!hasSpear) return;

        if (cooldown > 0) { cooldown--; return; }

        boolean isSprinting = mc.player.isSprinting();

        for (LivingEntity entity : mc.world.getEntitiesByClass(LivingEntity.class,
                mc.player.getBoundingBox().expand(isSprinting ? chargeRange : jabRange),
                e -> {
                    if (e == mc.player) return false;
                    if (!(e instanceof PlayerEntity)) return false;
                    return e.isAlive();
                })) {

            mc.player.swingHand(Hand.MAIN_HAND);
            mc.interactionManager.attackEntity(mc.player, entity);

            // Koşarken = charge attack (daha fazla hasar, daha uzun cooldown)
            // Duruşta = jab attack (hızlı vuruş)
            cooldown = isSprinting ? 15 : 6;
            break;
        }
    }
}
